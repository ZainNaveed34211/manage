name: Deploy Manage Worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - migrations/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inject D1 database id
        env:
          KLUZAR_ACCOUNTS_D1_ID: ${{ vars.KLUZAR_ACCOUNTS_D1_ID }}
        run: |
          if [ -z "$KLUZAR_ACCOUNTS_D1_ID" ]; then
            echo "KLUZAR_ACCOUNTS_D1_ID variable is not set" >&2
            exit 1
          fi
          sed -i "s/REPLACE_WITH_REAL_D1_DATABASE_ID/$KLUZAR_ACCOUNTS_D1_ID/" worker/wrangler.toml
          if grep -q "REPLACE_WITH_REAL_D1_DATABASE_ID" worker/wrangler.toml; then
            echo "D1 placeholder still present after inject" >&2
            exit 1
          fi
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply kluzar-accounts --remote --config worker/wrangler.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/wrangler.toml
